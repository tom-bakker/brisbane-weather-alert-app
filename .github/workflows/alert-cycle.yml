# Fetches weather, evaluates alert rules, emails subscribed groups and writes
# the email audit. Secrets come only from encrypted GitHub Actions secrets.
name: Alert cycle

on:
  # Started every 10 minutes by a Supabase pg_cron job (through the
  # trigger-alert-cycle Edge Function), and by the dashboard's "Refresh now".
  # GitHub's own `schedule` trigger is not used: it dropped most runs.
  # See supabase/migrations/20261111000000_alert_cycle_cron.sql.
  workflow_dispatch:

# Never run two cycles at once; a queued run waits for the current one.
concurrency:
  group: alert-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run alert cycle
        run: npm run alert-cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_FROM_NAME: ${{ vars.ALERT_FROM_NAME }}
